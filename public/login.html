<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login / Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="centered">
    <div class="card" style="width: 350px;">
        <div id="loginForm">
            <h2>Sign In</h2>
            <input type="email" id="loginEmail" placeholder="Email" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button onclick="login()">Login</button>
            <span class="toggle-link" onclick="toggleForms()">Need an account? Register</span>
        </div>
        <div id="registerForm" class="hidden">
            <h2>Create Account</h2>
            <input type="text" id="regName" placeholder="Full Name" required>
            <input type="email" id="regEmail" placeholder="Email" required>
            <input type="password" id="regPassword" placeholder="Password" required>
            <input type="password" id="regConfirm" placeholder="Confirm Password" required>
            <button onclick="register()">Register</button>
            <span class="toggle-link" onclick="toggleForms()">Already have an account? Login</span>
        </div>
        <p id="msg" class="msg"></p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
<script>
    // Only redirect if already logged in AND we have a valid user object
    const token = localStorage.getItem('token');
    const storedUser = localStorage.getItem('user');
    
    if (token && storedUser) {
        try {
            const user = JSON.parse(storedUser);
            // Redirect logged-in users to their proper dashboard
            if (user && user.role) {
                window.location.href = `/${user.role}.html`;
            }
        } catch (e) {
            // Corrupted localStorage — clear it and stay on login page
            localStorage.clear();
        }
    }

    function toggleForms() {
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        loginForm.classList.toggle('hidden');
        registerForm.classList.toggle('hidden');
        document.getElementById('msg').textContent = '';
    }

    function showMsg(text, isError) {
        const msg = document.getElementById('msg');
        msg.textContent = text;
        msg.className = 'msg ' + (isError ? 'error' : 'success');
    }

    async function login() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!email || !password) {
            return showMsg('Please enter email and password.', true);
        }

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();

            if (res.ok) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = data.redirectTo;
            } else {
                showMsg(data.error || 'Login failed', true);
            }
        } catch (err) {
            showMsg('Network error. Please try again.', true);
        }
    }

    async function register() {
        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regConfirm').value;

        if (!name || !email || !password) {
            return showMsg('All fields are required.', true);
        }
        if (password !== confirm) {
            return showMsg('Passwords do not match.', true);
        }

        try {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });
            const data = await res.json();

            if (res.ok) {
                showMsg('Registration successful! You can now log in.', false);
                toggleForms(); // switch back to login
            } else {
                showMsg(data.error || 'Registration failed', true);
            }
        } catch (err) {
            showMsg('Network error. Please try again.', true);
        }
    }
</script>
</body>
</html>
