<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>User Dashboard</h1>
            <div>
                <button class="btn-profile" onclick="window.location.href='/profile.html'">My Profile</button>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="card">
            <h2>Announcements from Admin</h2>
            <ul id="announcementFeed"><li>No announcements yet.</li></ul>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
<script>
    // --- SAFE AUTH GUARD ---
    const token = localStorage.getItem('token');
    let user = null;
    try { user = JSON.parse(localStorage.getItem('user')); } catch (e) { user = null; }

    if (!token || !user || user.role !== 'user') {
        localStorage.clear();
        window.location.href = '/login.html';
        throw new Error('Not authenticated');
    }

    const feed = document.getElementById('announcementFeed');

    // --- 1. AUTOMATIC CUSTOM BROADCAST FOR USERS ---
    if (feed.children[0] && feed.children[0].textContent === "No announcements yet.") {
        feed.innerHTML = '';
    }

    const welcomeBroadcast = document.createElement('li');
    welcomeBroadcast.className = 'system-broadcast';
    welcomeBroadcast.innerHTML = `
        <div style="font-size: 16px; margin-bottom: 5px;"><strong>System Broadcast</strong></div>
        Welcome to the platform, <strong>${user.name}</strong>!
        <br><small style="color: #475569;">Your User Dashboard is now active.</small>
    `;
    feed.prepend(welcomeBroadcast);

    // --- 2. LISTEN FOR ADMIN BROADCASTS ---
    const socket = io();
    socket.on('new_announcement', (data) => {
        const li = document.createElement('li');
        li.textContent = data.message;
        feed.prepend(li);
    });

    function logout() { localStorage.clear(); window.location.href = '/login.html'; }
</script>
</body>
</html>
